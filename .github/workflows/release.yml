name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p dist/DonutTaskManager
          cp target/release/donut-taskmgr dist/DonutTaskManager/
          cp icons/online.donutsdelivery.DonutTaskManager.svg dist/DonutTaskManager/
          cp -r icons/hicolor dist/DonutTaskManager/
          cp data/online.donutsdelivery.DonutTaskManager.desktop dist/DonutTaskManager/
          cp data/online.donutsdelivery.DonutTaskManager.metainfo.xml dist/DonutTaskManager/
          cp scripts/setup-shortcut.sh dist/DonutTaskManager/
          cp README.md LICENSE dist/DonutTaskManager/
          cd dist && tar czf ../DonutTaskManager-x86_64.tar.gz DonutTaskManager

      - name: Package standalone binary
        run: cp target/release/donut-taskmgr donut-taskmgr-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DonutTaskManager-x86_64.tar.gz
            donut-taskmgr-x86_64
